<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Analytics</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <a class="navbar-brand" href="/">PCB Inspector</a>
  <div class="collapse navbar-collapse">
    <ul class="navbar-nav mr-auto">
      <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
      <li class="nav-item"><a class="nav-link" href="/dashboard">Live</a></li>
    </ul>
  </div>
</nav>
<div class="container my-4">
  <div class="row">
    <div class="col-lg-6 mb-3">
      <div class="card">
        <div class="card-body">
          <h5 class="card-title">Defect Distribution</h5>
          <canvas id="dist"></canvas>
        </div>
      </div>
    </div>
    <div class="col-lg-6 mb-3">
      <div class="card">
        <div class="card-body">
          <h5 class="card-title">Recent Confidence</h5>
          <canvas id="conf"></canvas>
        </div>
      </div>
    </div>
  </div>
</div>
<script>
async function loadStats(){
  const r = await fetch('/api/analytics');
  const j = await r.json();
  const distCtx = document.getElementById('dist');
  new Chart(distCtx, {type:'pie', data:{labels:['Good','Bad'], datasets:[{data:[j.good, j.bad], backgroundColor:['#2a9d8f','#e76f51']}]} });
  const confCtx = document.getElementById('conf');
  const labels = j.recent.map(x=>x.t.substring(11,19));
  const data = j.recent.map(x=>x.confidence*100);
  new Chart(confCtx, {type:'line', data:{labels, datasets:[{label:'Confidence % (recent)', data, borderColor:'#457b9d'}]}, options:{scales:{y:{min:0,max:100}}} });
}
loadStats();
</script>
</body>
</html>
