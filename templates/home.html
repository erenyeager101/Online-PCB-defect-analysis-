<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PCB Quality Inspection</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" />
  <style>
    body { background: #f7f9fc; }
    .hero { background: linear-gradient(135deg,#1d3557,#457b9d); color:#fff; padding: 2rem; border-radius: 12px; }
    .upload-card { border: 1px dashed #6c757d; padding: 2rem; border-radius: 12px; background:#fff; }
    .dropzone { border: 2px dashed #adb5bd; border-radius:12px; padding: 30px; text-align:center; color:#6c757d; cursor:pointer; }
    .dropzone.dragover { background:#e9f5ff; border-color:#0d6efd; color:#0d6efd; }
  </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <a class="navbar-brand" href="/">PCB Inspector</a>
  <div class="collapse navbar-collapse">
    <ul class="navbar-nav mr-auto">
      <li class="nav-item active"><a class="nav-link" href="/">Home</a></li>
      <li class="nav-item"><a class="nav-link" href="/about">About</a></li>
    </ul>
  </div>
</nav>

<div class="container my-4">
  <div class="hero mb-4">
    <h1 class="mb-1">PCB Quality Inspection</h1>
    <p class="mb-0">Upload a PCB image to detect defects. You'll get the prediction, confidence, and an explainability heatmap (Grad-CAM).</p>
  </div>

  <div class="upload-card shadow-sm">
    <form id="uploadForm" action="/predict" method="post" enctype="multipart/form-data">
      <div id="dropzone" class="dropzone mb-3">
        <p class="mb-1">Drag & drop an image here</p>
        <small>or click to browse</small>
        <input id="fileInput" type="file" name="file" accept="image/*" style="display:none" />
      </div>
      <div class="text-right">
        <button type="submit" class="btn btn-primary">Analyze Image</button>
      </div>
    </form>
  </div>

  <div id="preview" class="mt-3" style="display:none;">
    <h6>Preview</h6>
    <img id="previewImg" class="img-thumbnail" style="max-width: 320px;" />
  </div>
</div>

<script>
  const drop = document.getElementById('dropzone');
  const input = document.getElementById('fileInput');
  const preview = document.getElementById('preview');
  const previewImg = document.getElementById('previewImg');

  drop.addEventListener('click', () => input.click());
  drop.addEventListener('dragover', (e) => { e.preventDefault(); drop.classList.add('dragover'); });
  drop.addEventListener('dragleave', () => drop.classList.remove('dragover'));
  drop.addEventListener('drop', (e) => {
    e.preventDefault(); drop.classList.remove('dragover');
    if (e.dataTransfer.files && e.dataTransfer.files[0]) {
      input.files = e.dataTransfer.files;
      showPreview(input.files[0]);
    }
  });
  input.addEventListener('change', () => { if (input.files[0]) showPreview(input.files[0]); });

  function showPreview(file) {
    const reader = new FileReader();
    reader.onload = (e) => { previewImg.src = e.target.result; preview.style.display = 'block'; };
    reader.readAsDataURL(file);
  }
</script>

</body>
</html>
