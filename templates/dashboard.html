<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Live Detection | PCB Inspector</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="hero-gradient">

<nav class="navbar navbar-expand-lg navbar-light sticky-top">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center" href="/">
            <i data-lucide="microchip" class="me-2"></i>
            PCB INSPECTOR
        </a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="/">Dashboard</a></li>
                <li class="nav-item"><a class="nav-link active" href="/dashboard">Live Feed</a></li>
                <li class="nav-item"><a class="nav-link" href="/analytics">Analytics</a></li>
                <li class="nav-item"><a class="nav-link" href="/about">Technology</a></li>
            </ul>
        </div>
    </div>
</nav>

<main class="container my-5 animate-fade-in">
    <div class="row g-4">
        <!-- Camera Feed -->
        <div class="col-lg-8">
            <div class="premium-card h-100">
                <h5 class="mb-4 d-flex align-items-center">
                    <i data-lucide="camera" class="me-2 text-primary"></i>
                    Live Camera Feed
                </h5>
                <div class="img-container bg-dark d-flex align-items-center justify-content-center" style="min-height: 400px; border-radius: 1rem;">
                    <video id="video" autoplay muted playsinline class="w-100 h-100" style="object-fit: cover; opacity: 0.9;"></video>
                    <canvas id="frame" style="display:none"></canvas>
                </div>
                <div class="mt-4 d-flex gap-3">
                    <button id="start" class="btn-premium"><i data-lucide="play"></i> Start Inspection</button>
                    <button id="pause" class="btn btn-outline-secondary d-inline-flex align-items-center gap-2"><i data-lucide="pause"></i> Pause</button>
                    <span id="statusBadge" class="badge bg-secondary ms-auto align-self-center py-2 px-3 rounded-pill">Offline</span>
                </div>
            </div>
        </div>

        <!-- Live Predictions & Stats -->
        <div class="col-lg-4">
            <div class="premium-card mb-4" id="predictionCard">
                <h5 class="mb-4 d-flex align-items-center">
                    <i data-lucide="activity" class="me-2 text-primary"></i>
                    Real-time Analysis
                </h5>
                
                <div class="mb-3">
                    <label class="text-muted small d-block mb-1">Current Classification</label>
                    <span id="label" class="badge bg-secondary fs-6 py-2 px-3 rounded-pill">—</span>
                </div>
                
                <div class="mb-4">
                    <label class="text-muted small d-block mb-1">Confidence</label>
                    <h3 id="conf" class="fw-bold text-primary mb-0">—</h3>
                </div>

                <div class="img-container mt-3" style="max-height: 200px; display: none;" id="liveImgWrapper">
                    <img id="liveImg" class="img-fluid w-100" alt="Latest Frame" style="object-fit: cover; max-height: 200px;" />
                </div>
            </div>

            <div class="premium-card">
                <h6 class="fw-bold mb-3 d-flex align-items-center">
                    <i data-lucide="bar-chart-2" class="me-2 text-success"></i>
                    Session Statistics
                </h6>
                <div class="d-flex justify-content-between mb-2">
                    <span class="text-muted">Total Scanned:</span>
                    <span class="fw-semibold" id="total">0</span>
                </div>
                <div class="d-flex justify-content-between mb-2">
                    <span class="text-muted">Good Quality:</span>
                    <span class="fw-semibold text-success" id="good">0</span>
                </div>
                <div class="d-flex justify-content-between mb-2">
                    <span class="text-muted">Defects Found:</span>
                    <span class="fw-semibold text-danger" id="bad">0</span>
                </div>
                <hr class="border-secondary opacity-25">
                <div class="d-flex justify-content-between">
                    <span class="text-muted">Avg Confidence:</span>
                    <span class="fw-bold text-primary" id="avg">0%</span>
                </div>
            </div>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    lucide.createIcons();
    
    const video = document.getElementById('video');
    const canvas = document.getElementById('frame');
    const ctx = canvas.getContext('2d');
    const statusBadge = document.getElementById('statusBadge');
    let running = false; let timer = null;

    async function initCam(){
        try {
            const stream = await navigator.mediaDevices.getUserMedia({video:true, audio:false});
            video.srcObject = stream;
        } catch (e) {
            console.error(e);
            statusBadge.textContent = "Camera Blocked";
            statusBadge.className = "badge bg-danger ms-auto align-self-center py-2 px-3 rounded-pill";
        }
    }
    initCam();

    async function tick(){
        if (!running) return;
        canvas.width = video.videoWidth; canvas.height = video.videoHeight;
        if(canvas.width === 0) return setTimeout(tick, 400);
        
        ctx.drawImage(video, 0, 0);
        const data = canvas.toDataURL('image/jpeg', 0.7);
        try {
            const r = await fetch('/api/live_predict', {
                method:'POST', 
                headers:{'Content-Type':'application/json'}, 
                body: JSON.stringify({image:data})
            });
            const j = await r.json();
            if (j.ok){
                const lbl = document.getElementById('label');
                lbl.textContent = j.label;
                
                if (j.label.toLowerCase() === 'good') {
                    lbl.className = 'badge badge-good fs-6 py-2 px-4';
                } else if (j.label.toLowerCase() === 'bad') {
                    lbl.className = 'badge badge-bad fs-6 py-2 px-4';
                }
                
                document.getElementById('conf').textContent = (j.confidence*100).toFixed(1)+'%';
                
                const liveImg = document.getElementById('liveImg');
                liveImg.src = j.image;
                document.getElementById('liveImgWrapper').style.display = 'block';
                
                refreshStats();
            }
        } catch(e){ console.error(e); }
        timer = setTimeout(tick, 800); // Check every 800ms
    }

    function start(){ 
        if (!running){ 
            running = true; 
            statusBadge.textContent = "Active";
            statusBadge.className = "badge bg-success ms-auto align-self-center py-2 px-3 rounded-pill";
            tick(); 
        } 
    }
    
    function pause(){ 
        running = false; 
        if (timer) clearTimeout(timer); 
        statusBadge.textContent = "Paused";
        statusBadge.className = "badge bg-warning text-dark ms-auto align-self-center py-2 px-3 rounded-pill";
    }
    
    document.getElementById('start').onclick = start;
    document.getElementById('pause').onclick = pause;

    async function refreshStats(){
        try {
            const r = await fetch('/api/analytics');
            const j = await r.json();
            document.getElementById('total').textContent = j.total;
            document.getElementById('good').textContent = j.good;
            document.getElementById('bad').textContent = j.bad;
            document.getElementById('avg').textContent = j.avg_confidence ? (j.avg_confidence*100).toFixed(1)+'%' : '0%';
        } catch(e){ }
    }
    refreshStats();
</script>
</body>
</html>
